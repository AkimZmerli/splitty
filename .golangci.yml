run:
  timeout: 5m

issues:
  exclude-rules:
    # Exclude errcheck in test files (test utilities may not check all errors)
    - path: _test\.go
      linters:
        - errcheck
    # Exclude unused in test files (test helpers may not be used everywhere)
    - path: _test\.go
      linters:
        - unused
    # Exclude gocritic commentedOutCode in cell_test.go (existing commented examples)
    - path: cell_test\.go
      linters:
        - gocritic
      text: "commentedOutCode"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gocritic
    - misspell
    - revive

linters-settings:
  errcheck:
    check-type-assertions: true
  gocritic:
    enabled-tags:
      - diagnostic
      - style
  revive:
    rules:
      - name: exported
        severity: warning
